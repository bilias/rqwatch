name: Security tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  access:
    name: Access control
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: ldap, redis, mailparse, mbstring, iconv, pdo_mysql, gmp, curl
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Route access and middleware tests
        run: composer test-access

  scoping:
    name: Data scoping
    runs-on: ubuntu-24.04
    services:
      mariadb:
        # production's major version; keep in sync with MARIADB_IMAGE in qa/scoping-tests.sh
        image: docker.io/library/mariadb:10.11@sha256:6c65a843396dc6c78dd0da19eccaa0a91d25d9d26a4c2afcb75010ac3f59f5ea
        env:
          MARIADB_ROOT_PASSWORD: scoping-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: ldap, redis, mailparse, mbstring, iconv, pdo_mysql, gmp, curl
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Data scoping tests
        env:
          SCOPING_DB_EXEC: docker exec -i ${{ job.services.mariadb.id }} mariadb -uroot -pscoping-test
          SCOPING_DB_HOST: 127.0.0.1
          SCOPING_DB_PORT: '3306'
          SCOPING_DB_PASS: scoping-test
        run: bash qa/scoping-tests.sh
