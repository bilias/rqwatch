name: Static analysis

on:
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: ldap, redis, mailparse, mbstring, iconv, pdo_mysql, gmp, curl
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: composer phpstan -- --no-progress --error-format=github

      - name: Psalm
        run: composer psalm -- --no-cache --output-format=github

      - name: Psalm taint
        run: composer psalm-taint -- --output-format=github --report=psalm-taint.sarif

      - name: Upload taint results to Security tab
        if: ${{ !cancelled() && hashFiles('psalm-taint.sarif') != '' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: psalm-taint.sarif
          category: psalm-taint

      - name: Taint stub matches vendor
        run: php qa/gen-taint-stubs.php | diff -u qa/taint-stubs.phpstub -
