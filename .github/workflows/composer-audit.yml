name: Composer audit

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # daily: new advisories appear without code changes
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Composer audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Composer audit
        run: composer audit --locked --abandoned=report
