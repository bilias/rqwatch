name: CI

# One workflow for every check. Push and PR run all jobs but ZAP; each cron
# runs only its own job (the if: lines below), and a manual run runs
# everything but ZAP, unless its zap input is ticked.

concurrency:
  # the event keeps a long scheduled run from queueing the checks of a push
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # audit, daily: new advisories appear without code changes
    - cron: '23 5 * * *'
    # e2e, weekly: rspamd:4, mariadb:10.11 and redis:7 are moving tags, catch
    # upstream changes between pushes
    - cron: '41 4 * * 1'
    # ZAP, weekly: up to an hour against httpd + PHP-FPM
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      zap:
        description: Also run the ZAP scan (about an hour)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    name: Composer validate + audit
    if: github.event_name != 'schedule' || github.event.schedule == '23 5 * * *'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      # composer.json well formed, composer.lock in sync with it
      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Composer audit
        run: composer audit --locked --abandoned=report

  static:
    name: PHPStan + Psalm
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: ldap, redis, mailparse, mbstring, iconv, pdo_mysql, gmp, curl
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer install
        id: install
        run: composer install --no-interaction --no-progress --prefer-dist

      # fail fast and visibly when the stub no longer matches vendor
      # (qa/psalm-taint.sh checks it again before the analysis)
      - name: Taint stub matches vendor
        run: sh qa/taint-stubs.sh --check

      # each check runs even if an earlier one failed, so one run reports all
      - name: PHPStan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer phpstan -- --no-progress --error-format=github

      - name: Psalm
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer psalm -- --no-cache --output-format=github

      # findings go only to the SARIF report, for the Security tab (write
      # access only): nothing in the public log, no PR annotations. With a
      # report under GitHub Actions, Psalm exits 0 on taint findings, so the
      # step fails only when the analysis itself does
      - name: Psalm taint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer psalm-taint -- --report=psalm-taint.sarif --report-show-info=false > /dev/null

      # the taint setup still finds planted flows and honours its escapes
      - name: Taint self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer taint-selftest

      # push only: results uploaded for a pull request become annotations on
      # it, which anyone who can read the repository sees
      - name: Upload taint results to Security tab
        if: ${{ !cancelled() && hashFiles('psalm-taint.sarif') != '' && github.actor != 'dependabot[bot]' && github.event_name == 'push' }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: psalm-taint.sarif
          category: psalm-taint

  opengrep:
    name: Opengrep
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      OPENGREP_VERSION: v1.30.2
      # sha256 of opengrep_manylinux_x86 at that version: bump both together
      OPENGREP_SHA256: a66aa3278457f02b287b985a45b6762aebcaba5000f2689245fd1ed86d1456c7
      # some community rule files are UTF-8; Opengrep reads them with the locale's encoding
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pinned by SHA-256 (taken from a cosign-verified download when
      # OPENGREP_VERSION is bumped): one release download, no installer
      - name: Install Opengrep (hash-pinned)
        run: |
          F=opengrep_manylinux_x86
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-delay 15 -o "$F" "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/${F}"
          echo "${OPENGREP_SHA256}  ${F}" | sha256sum -c -
          install -D -m 0755 "$F" "$RUNNER_TEMP/bin/opengrep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # findings go only to the SARIF report, for the Security tab (write
      # access only): nothing in the public log. qa/opengrep.sh runs with
      # --error, so exit 1 means findings; anything higher is a failed scan,
      # and only then is Opengrep's own output shown
      - name: Opengrep
        run: |
          rc=0
          sh qa/opengrep.sh --sarif-output=opengrep.sarif > /dev/null 2> opengrep.err || rc=$?
          if [ "$rc" -gt 1 ]; then
            cat opengrep.err >&2
            exit "$rc"
          fi

      # GitHub ignores SARIF suppressions; keep only results not marked nosemgrep
      - name: Drop suppressed results from SARIF
        if: ${{ !cancelled() && hashFiles('opengrep.sarif') != '' }}
        run: |
          jq '.runs[].results |= map(select((.suppressions // []) == []))' opengrep.sarif > opengrep.tmp
          mv opengrep.tmp opengrep.sarif

      # push only: results uploaded for a pull request become annotations on
      # it, which anyone who can read the repository sees
      - name: Upload Opengrep results to Security tab
        if: ${{ !cancelled() && hashFiles('opengrep.sarif') != '' && github.actor != 'dependabot[bot]' && github.event_name == 'push' }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: opengrep.sarif
          category: opengrep

  web-image:
    # the web image (qa/web) for tests and e2e, built once per PHP version and
    # day here rather than by every job that needs it; lookup-only: a hit
    # downloads nothing, a miss builds, and actions/cache saves at the end
    name: Web image (PHP ${{ matrix.php }})
    if: github.event_name != 'schedule' || github.event.schedule == '41 4 * * 1'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # quoted: 8.3 is a number in YAML
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Web image cache key
        id: web-image
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: web-cache
        with:
          path: ${{ runner.temp }}/qa-web.tar
          key: qa-web-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('qa/web/Containerfile') }}-${{ steps.web-image.outputs.date }}
          lookup-only: true

      - name: Build web image
        if: steps.web-cache.outputs.cache-hit != 'true'
        env:
          PHP_STREAM: remi-${{ matrix.php }}
        run: |
          . qa/lib.sh
          web_image
          podman save -o "${RUNNER_TEMP}/qa-web.tar" "$WEB_IMAGE"

  tests:
    # integration without, then with Redis (sessions, config and migration
    # caches, login throttle), in one run of qa/integration-tests.sh, on each
    # supported PHP version (qa/each-php.sh locally). Unit tests need neither
    # service
    name: Unit + Integration (PHP ${{ matrix.php }})
    needs: web-image
    # !cancelled(): run even if web-image failed; start_web_container then
    # builds the image itself
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # quoted: 8.3 is a number in YAML
        php: ['8.3', '8.4']
    services:
      mariadb:
        # production's major version; keep in sync with MARIADB_IMAGE in qa/integration-tests.sh
        image: docker.io/library/mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: integration-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mailpit:
        # keep in sync with MAILPIT_IMAGE in qa/integration-tests.sh
        image: docker.io/axllent/mailpit:v1
        ports:
          - 1025:1025
          - 8025:8025
      redis:
        # used by the Redis-on leg; keep in sync with REDIS_IMAGE in qa/integration-tests.sh
        image: docker.io/library/redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ldap, redis, mailparse, mbstring, iconv, pdo_mysql, gmp, curl
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      # the web image built by web-image: start_web_container uses a restored
      # image whose label matches instead of building it
      - name: Web image cache key
        id: web-image
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: web-cache
        with:
          path: ${{ runner.temp }}/qa-web.tar
          key: qa-web-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('qa/web/Containerfile') }}-${{ steps.web-image.outputs.date }}

      - name: Load web image
        if: steps.web-cache.outputs.cache-hit == 'true'
        run: podman load -q -i "${RUNNER_TEMP}/qa-web.tar"

      # seconds, no database: a failure here stops the job before Integration
      - name: Unit tests
        run: bash qa/unit-tests.sh

      - name: Integration tests, Redis off and on (access, smoke, retention, scoping, release, notifications)
        env:
          INTEGRATION_DB_EXEC: docker exec -i ${{ job.services.mariadb.id }} mariadb -uroot -pintegration-test
          INTEGRATION_DB_HOST: 127.0.0.1
          INTEGRATION_DB_PORT: '3306'
          INTEGRATION_DB_PASS: integration-test
          INTEGRATION_MAILPIT_SMTP_PORT: '1025'
          INTEGRATION_MAILPIT_HTTP_PORT: '8025'
          # both legs: the harness runs off, then on, against these services,
          # reseeding the database and clearing Mailpit between them
          INTEGRATION_REDIS_PORT: '6379'
        run: bash qa/integration-tests.sh

  e2e:
    # the importer without, then with this instance's Redis (caches, the
    # spool), in one run of qa/e2e-tests.sh, on each supported PHP version;
    # rspamd's fuzzy storage uses Redis either way
    name: End to end (PHP ${{ matrix.php }})
    needs: web-image
    # as in tests: run even if web-image failed
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.event.schedule == '41 4 * * 1') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # quoted: 8.3 is a number in YAML
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ldap, redis, mailparse, mbstring, iconv, pdo_mysql, gmp, curl
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      # the web image built by web-image: start_web_container uses a restored
      # image whose label matches instead of building it
      - name: Web image cache key
        id: web-image
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: web-cache
        with:
          path: ${{ runner.temp }}/qa-web.tar
          key: qa-web-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('qa/web/Containerfile') }}-${{ steps.web-image.outputs.date }}

      - name: Load web image
        if: steps.web-cache.outputs.cache-hit == 'true'
        run: podman load -q -i "${RUNNER_TEMP}/qa-web.tar"

      # both legs, Redis off then on, on the same containers; a failing leg
      # does not stop the other
      - name: Rspamd and importer
        run: bash qa/e2e-tests.sh

  zap:
    # OWASP ZAP (qa/zap-scan.sh, the alert baseline in qa/zap/rqwatch.yaml),
    # as alice and admin. Findings go to the Security tab only: the harness's
    # output stays off this public log unless the scan itself breaks (and then
    # without alert lines), nothing is kept as an artifact, and a finding
    # doesn't fail the job
    name: ZAP scan
    if: (github.event_name == 'schedule' && github.event.schedule == '17 3 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.zap)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the host PHP seeds the copy (bin/cli.php); the web server is the
      # container's, remi-8.4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ldap, redis, mailparse, mbstring, iconv, pdo_mysql, gmp, curl
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      # done when both SARIF reports exist, whatever ZAP found; the log is
      # shown only when one is missing, and then without alert lines
      - name: ZAP scan
        run: |
          status=0
          bash qa/zap-scan.sh > "${RUNNER_TEMP}/zap.log" 2>&1 || status=$?
          if [ -s zap-report/rqwatch-zap-alice.sarif ] && [ -s zap-report/rqwatch-zap-admin.sarif ]; then
            echo "Scan complete; results in the Security tab"
            exit 0
          fi
          echo "The scan did not finish (exit ${status}); the harness log without alert lines:"
          grep -vi 'alert' "${RUNNER_TEMP}/zap.log" | tail -n 80
          exit 1

      # GitHub code scanning takes only repository paths, but ZAP's SARIF
      # locates each finding by its URL: keep the URL in the message and map
      # its path under zap/, so each URL stays its own alert
      - name: Map ZAP SARIF locations to paths
        if: ${{ !cancelled() && hashFiles('zap-report/*.sarif') != '' }}
        run: |
          for f in zap-report/rqwatch-zap-*.sarif; do
            jq '.runs[].results |= map(select(.level != "none") | (
              .message.text += "\n\nURL: " + ([.locations[].physicalLocation.artifactLocation.uri] | join(", "))
              | .locations[].physicalLocation.artifactLocation.uri |= ("zap/" + (sub("^[a-z]+://[^/]*/?"; "") | sub("[?#].*$"; "") | if . == "" then "index" else . end))
            ))' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Upload ZAP results (alice) to Security tab
        if: ${{ !cancelled() && hashFiles('zap-report/rqwatch-zap-alice.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: zap-report/rqwatch-zap-alice.sarif
          category: zap-alice

      - name: Upload ZAP results (admin) to Security tab
        if: ${{ !cancelled() && hashFiles('zap-report/rqwatch-zap-admin.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: zap-report/rqwatch-zap-admin.sarif
          category: zap-admin
