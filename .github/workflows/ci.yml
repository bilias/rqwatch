name: CI

# One workflow for every check. Push and PR run all jobs; each cron runs only
# its own job (the if: lines below), and a manual run runs everything.

concurrency:
  # the event keeps a long scheduled run from queueing the checks of a push
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # audit, daily: new advisories appear without code changes
    - cron: '23 5 * * *'
    # e2e, weekly: rspamd:4, mariadb:10.11 and redis:7 are moving tags, catch
    # upstream changes between pushes
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Composer validate + audit
    if: github.event_name != 'schedule' || github.event.schedule == '23 5 * * *'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      # composer.json well formed, composer.lock in sync with it
      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Composer audit
        run: composer audit --locked --abandoned=report

  static:
    name: PHPStan + Psalm
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: ldap, redis, mailparse, mbstring, iconv, pdo_mysql, gmp, curl
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer install
        id: install
        run: composer install --no-interaction --no-progress --prefer-dist

      # fail fast and visibly when the stub no longer matches vendor
      # (qa/psalm-taint.sh checks it again before the analysis)
      - name: Taint stub matches vendor
        run: sh qa/taint-stubs.sh --check

      # each check runs even if an earlier one failed, so one run reports all
      - name: PHPStan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer phpstan -- --no-progress --error-format=github

      - name: Psalm
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer psalm -- --no-cache --output-format=github

      - name: Psalm taint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer psalm-taint -- --output-format=github --report=psalm-taint.sarif --report-show-info=false

      # the taint setup still finds planted flows and honours its escapes
      - name: Taint self-test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: composer taint-selftest

      - name: Upload taint results to Security tab
        if: ${{ !cancelled() && hashFiles('psalm-taint.sarif') != '' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: psalm-taint.sarif
          category: psalm-taint

  opengrep:
    name: Opengrep
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      OPENGREP_VERSION: v1.30.2
      # some community rule files are UTF-8; Opengrep reads them with the locale's encoding
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install Opengrep (signature-verified)
        run: |
          F=opengrep_manylinux_x86
          URL="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/${F}"
          cd "$RUNNER_TEMP"
          for x in "" .sig .cert; do curl -fsSLO "${URL}${x}"; done
          cosign verify-blob --cert "${F}.cert" --signature "${F}.sig" \
            --certificate-identity-regexp '^https://github\.com/opengrep/opengrep/\.github/workflows/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$F"
          install -D -m 0755 "$F" "$RUNNER_TEMP/bin/opengrep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Opengrep
        run: sh qa/opengrep.sh --sarif-output=opengrep.sarif

      # GitHub ignores SARIF suppressions; keep only results not marked nosemgrep
      - name: Drop suppressed results from SARIF
        if: ${{ !cancelled() && hashFiles('opengrep.sarif') != '' }}
        run: |
          jq '.runs[].results |= map(select((.suppressions // []) == []))' opengrep.sarif > opengrep.tmp
          mv opengrep.tmp opengrep.sarif

      - name: Upload Opengrep results to Security tab
        if: ${{ !cancelled() && hashFiles('opengrep.sarif') != '' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: opengrep.sarif
          category: opengrep

  tests:
    # integration without and with Redis (sessions, config and migration
    # caches, login throttle), on each supported PHP version (qa/each-php.sh
    # locally). Unit tests need neither service: once per PHP version
    name: Tests (PHP ${{ matrix.php }}, Redis ${{ matrix.redis }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # quoted: bare off/on are booleans in YAML 1.1, 8.3 a number
        redis: ['off', 'on']
        php: ['8.3', '8.4']
    services:
      mariadb:
        # production's major version; keep in sync with MARIADB_IMAGE in qa/integration-tests.sh
        image: docker.io/library/mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: integration-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mailpit:
        # keep in sync with MAILPIT_IMAGE in qa/integration-tests.sh
        image: docker.io/axllent/mailpit:v1
        ports:
          - 1025:1025
          - 8025:8025
      redis:
        # used only by the Redis leg; keep in sync with REDIS_IMAGE in qa/integration-tests.sh
        image: docker.io/library/redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ldap, redis, mailparse, mbstring, iconv, pdo_mysql, gmp, curl
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      # seconds, no database: a failure here stops the job before Integration
      - name: Unit tests
        if: matrix.redis == 'off'
        run: bash qa/unit-tests.sh

      - name: Integration tests (access, smoke, retention, scoping, release, notifications)
        env:
          INTEGRATION_DB_EXEC: docker exec -i ${{ job.services.mariadb.id }} mariadb -uroot -pintegration-test
          INTEGRATION_DB_HOST: 127.0.0.1
          INTEGRATION_DB_PORT: '3306'
          INTEGRATION_DB_PASS: integration-test
          INTEGRATION_MAILPIT_SMTP_PORT: '1025'
          INTEGRATION_MAILPIT_HTTP_PORT: '8025'
          # empty in the off leg: the harness leaves REDIS_ENABLE=false
          INTEGRATION_REDIS_PORT: ${{ matrix.redis == 'on' && '6379' || '' }}
        run: bash qa/integration-tests.sh

  e2e:
    # the importer with and without this instance's Redis (caches, the spool),
    # on each supported PHP version; rspamd's fuzzy storage uses Redis either way
    name: End to end (PHP ${{ matrix.php }}, Redis ${{ matrix.redis }})
    if: github.event_name != 'schedule' || github.event.schedule == '41 4 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # quoted: bare off/on are booleans in YAML 1.1, 8.3 a number
        redis: ['off', 'on']
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ldap, redis, mailparse, mbstring, iconv, pdo_mysql, gmp, curl
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Rspamd and importer
        env:
          E2E_REDIS: ${{ matrix.redis == 'on' && '1' || '0' }}
        run: bash qa/e2e-tests.sh
