# Rspamd actions for qa/import-tests.sh: thresholds well apart from the
# test mails' scores, so network checks cannot change a verdict.
greylist = 15;
add_header = 20;
reject = 40;

# discard is not a built-in action (contrib's force_actions.conf needs it);
# its threshold sits between add_header and reject
discard = 30;
