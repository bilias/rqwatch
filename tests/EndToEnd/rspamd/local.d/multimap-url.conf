# url maps as a site runs them, read from rqwatch's custom maps body_url_host,
# body_url_full and white_url_host; qa/e2e-tests.sh appends these to contrib's
# multimap.conf.
# tests/EndToEnd/Import/UrlMapsTest.php checks that rspamd still reads a URL,
# and its host, as rqwatch stores them.
RQWATCH_BODY_URL_HOST {
  type = "url";
  map = "http://127.0.0.1/maps/body_url_host.txt";
  score = 10.0;
  one_shot = true;
}
# full URLs only
RQWATCH_BODY_URL_FULL {
  type = "url";
  filter = "full";
  map = "http://127.0.0.1/maps/body_url_full.txt";
  score = 10.0;
}
# a mark at score 0, for composites
RQWATCH_WHITE_URL_HOST {
  type = "url";
  map = "http://127.0.0.1/maps/white_url_host.txt";
  score = 0.0;
}
