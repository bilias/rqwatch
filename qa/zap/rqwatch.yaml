# Rqwatch: OWASP ZAP Automation Framework plan, run by qa/zap-scan.sh, which
# sets ZAP_TARGET (base URL) and ZAP_ADMIN_ID, and passes the admin session
# to ZAP as ZAP_AUTH_HEADER_VALUE: ZAP adds it to every request itself (the
# replacer job would not expand an environment variable in its rules)
env:
  contexts:
    - name: rqwatch
      urls:
        - "${ZAP_TARGET}/"
        - "${ZAP_TARGET}/admin"
      includePaths:
        - "${ZAP_TARGET}/.*"
      excludePaths:
        # the link carries the logout token: it would end the session
        - "${ZAP_TARGET}/logout.*"
        # loginAs replaces the admin session with another user's
        - "${ZAP_TARGET}/admin/user/login/.*"
        # editing or disabling the scanning user revokes its session
        - "${ZAP_TARGET}/admin/user/edit/${ZAP_ADMIN_ID}([?#].*)?"
        - "${ZAP_TARGET}/openidc/.*"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
jobs:
  - type: spider
    parameters:
      context: rqwatch
      maxDuration: 5
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      context: rqwatch
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 20
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: rqwatch-zap.html
      reportTitle: rqwatch ZAP scan
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: rqwatch-zap.json
  - type: exitStatus
    parameters:
      errorLevel: High
