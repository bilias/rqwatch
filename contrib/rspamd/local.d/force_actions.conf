# Discard viruses even from whitelisted senders. The whitelist maps
# (multimap.conf) force "accept"; this rule outranks it at high priority,
# which needs rspamd 4.2.3+ (older versions ignore the setting, and the
# whitelist wins). Antivirus false positives belong in antivirus.conf's
# whitelist (virus names). Adjust the expression to your antivirus symbols.
rules {
	CLAM_DISCARD {
		action = "discard";
		priority = "high";
		expression = "CLAM_VIRUS";
		message = "Rejected due to suspicion of virus";
	}
}
