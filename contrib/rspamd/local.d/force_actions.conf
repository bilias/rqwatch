# Whitelist maps (multimap.conf) end in a prefilter "accept": force an action
# on viruses so a whitelisted or forged sender cannot deliver one.
# Adjust the expression to your antivirus symbol names.
rules {
	CLAM_DISCARD {
		action = "discard";
		expression = "CLAM_VIRUS";
		message = "Rejected due to suspicion of virus";
	}
}
